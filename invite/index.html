<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>you’re invited to braw</title><meta name="description" content="A pet, a room, and a little world with your real friends. Open your invitation to Braw."><meta property="og:type" content="website"><meta property="og:title" content="you’re invited to braw 🧡"><meta property="og:description" content="A pet, your own room, and little moments together. Your friend saved you a spot."><meta property="og:image" content="https://charvelchedraui.github.io/braw-site/invite/card.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Braw: a little world, your real friends. An illustrated room and pet."><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://charvelchedraui.github.io/braw-site/invite/card.png"><meta name="theme-color" content="#f65410"><link rel="icon" href="../icon.png">
<style>:root{color-scheme:light dark;--bg:#ecebe7;--card:#f7f6f2;--ink:#242320;--muted:#68665e;--line:#d8d6cf;--brand:#f65410}@media(prefers-color-scheme:dark){:root{--bg:#151514;--card:#22221f;--ink:#f4f1e8;--muted:#b7b3a9;--line:#44413b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:520px;margin:auto;padding:28px 20px 44px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top a{color:var(--ink);text-decoration:none;font-size:28px;font-weight:700;letter-spacing:-1.5px}.lang{background:transparent;border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:20px;cursor:pointer}.art{width:100%;display:block;border-radius:22px;border:1px solid var(--line)}h1{font-size:32px;line-height:1.1;letter-spacing:-1px;margin:28px 0 12px}p{color:var(--muted);margin:0 0 20px}.code{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:24px 0}.code strong{font:600 22px ui-monospace,monospace;letter-spacing:2px}.code button{border:0;background:none;color:var(--ink);font:inherit;text-decoration:underline;cursor:pointer}.cta{display:block;text-align:center;background:var(--brand);color:#141414;text-decoration:none;border:1.5px solid #242320;border-radius:16px;padding:15px 18px;font-weight:650;margin:12px 0}.secondary{background:var(--card);color:var(--ink);border-color:var(--line)}.small{font-size:13px;margin:18px 0}.status{min-height:24px;font-size:14px}footer{margin-top:32px;font-size:13px}footer a{color:var(--muted)}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--brand);outline-offset:4px}</style></head>
<body><main><div class="top"><a href="../">braw</a><button id="language" class="lang" type="button">español</button></div><img class="art" src="card.png" alt="braw — a little world, your real friends" width="1200" height="630"><h1 id="title"></h1><p id="intro"></p><div id="codeBox" class="code"><strong id="code"></strong><button id="copy" type="button"></button></div><a id="open" class="cta"></a><a id="install" class="cta secondary" href="https://testflight.apple.com/join/Yx2byAmn"></a><p id="help" class="small"></p><p id="status" class="status" role="status" aria-live="polite"></p><footer><a href="../privacy/">Privacy · Privacidad</a> · <a href="../support/">Support · Soporte</a></footer></main>
<script>
const params=new URLSearchParams(location.search),raw=(params.get('code')||'').trim().toUpperCase(),valid=/^BRAW-[A-HJ-NP-Z2-9]{4}$/.test(raw);let lang=params.get('lang')==='es'?'es':params.get('lang')==='en'?'en':navigator.language.startsWith('es')?'es':'en';
const copy={en:{title:'your friend saved you a spot.',intro:'a pet to care for, a room to make yours, and a little world to share together.',open:'open my invitation in braw',install:'get braw on TestFlight',help:'already have braw? open your invitation and the code will be ready. installing for the first time? install braw, then return to this link. beta access requires a TestFlight invitation.',copy:'copy',copied:'code copied',missing:'you need an invitation.',invalid:'ask your friend to send you their full invitation link.',fallback:'if braw didn’t open, install it using your TestFlight invitation. you can also copy the code and enter it in braw.'},es:{title:'tu braw te guardó un lugar.',intro:'una mascota que cuidar, un cuarto para hacerlo tuyo y un pequeño mundo para compartir.',open:'abrir mi invitación en braw',install:'instalar braw en TestFlight',help:'¿ya tienes braw? abre tu invitación y el código estará listo. ¿es tu primera vez? instala braw y después vuelve a este enlace. el acceso a la beta requiere una invitación de TestFlight.',copy:'copiar',copied:'código copiado',missing:'necesitas una invitación.',invalid:'pídele a tu braw que te mande el enlace completo de su invitación.',fallback:'si braw no se abrió, instálala desde tu invitación de TestFlight. también puedes copiar el código e ingresarlo en braw.'}};
function render(){const t=copy[lang];document.documentElement.lang=lang;document.getElementById('title').textContent=valid?t.title:t.missing;document.getElementById('intro').textContent=valid?t.intro:t.invalid;document.getElementById('codeBox').hidden=!valid;document.getElementById('open').hidden=!valid;document.getElementById('code').textContent=valid?raw:'';document.getElementById('open').textContent=t.open;document.getElementById('open').href=valid?'braw://invite/'+encodeURIComponent(raw):'#';document.getElementById('install').textContent=t.install;document.getElementById('help').textContent=t.help;document.getElementById('copy').textContent=t.copy;document.getElementById('language').textContent=lang==='en'?'español':'english';document.getElementById('status').textContent=''}
document.getElementById('language').onclick=()=>{lang=lang==='es'?'en':'es';render()};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(raw);document.getElementById('status').textContent=copy[lang].copied}catch{const sel=getSelection(),range=document.createRange();range.selectNodeContents(document.getElementById('code'));sel.removeAllRanges();sel.addRange(range)}};document.getElementById('open').onclick=()=>{document.getElementById('status').textContent=copy[lang].fallback};render();
</script></body></html>
